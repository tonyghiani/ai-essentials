<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cursor, Skills & Subagents — EAH Madrid 2026</title>

    <!--
      Single-file deck. Open this file directly (file:// is fine).
      - Default URL (no query string) renders the audience-facing deck.
      - "?view=presenter" renders the speaker's presenter view (current
         slide preview + speaker notes + next slide + timers). Both
         windows talk to each other over a BroadcastChannel named
         "cursor-skills-deck" so nav stays in sync.
      - Press N in the main deck (or click the "N · notes" chrome
         button) to open the presenter view in a second window.
    -->

    <script>
      // Set mode BEFORE the CSS parses so the scoped html[data-mode=...]
      // rules pick the right background on the first paint and we never
      // flash the wrong colour.
      (function () {
        var qs = new URLSearchParams(window.location.search);
        var isPresenter = qs.get("view") === "presenter";
        document.documentElement.dataset.mode = isPresenter ? "presenter" : "deck";
        if (isPresenter) {
          document.title = "Presenter notes — Cursor, Skills & Subagents";
        }
      })();
    </script>

    <!-- Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ════════════════════════════════════════════════════════════
       * Deck stylesheet (formerly scripts/deck.css).
       * The html, body, #root rule has been scoped to data-mode="deck"
       * so the presenter view's dark navy chrome is not overridden when
       * both styles live in the same document.
       * ════════════════════════════════════════════════════════════ */
/* ============================================================
 * Deck stylesheet — EAH Madrid 2026 design system.
 * Loaded by index.html via <link rel="stylesheet">.
 *
 * The palette and component classes here are derived directly
 * from assets/EAH 26 Deck Template - MAKE A COPY.pdf.
 *
 * Palette (from assets/EAH 26 Deck Template - MAKE A COPY.pdf):
 *   --eah-blue        #0b64dd   primary brand fill
 *   --eah-blue-bright #1893ff   pale shadow word, link hover
 *   --eah-blue-light  #44a8fe   tints / hover
 *   --eah-navy        #101c3f   stat / quote dark backgrounds
 *   --eah-gold        #fec514   yellow quote bg / step 1
 *   --eah-gold-warm   #ffad19   warm sun accent
 *   --eah-magenta     #f04e98   step 2 accent
 *   --eah-mint        #48efcf   stat number / step 3 / accent words
 *   --ink             #1d1e23   body text on light bg
 *   --paper           #ffffff   light slide background
 *   --eah-card        #eff1f4   light card / FPO panel
 *   --rule            rgba(11, 100, 221, 0.55) thin agenda rule
 * ============================================================ */

:root {
  --eah-blue: #0b64dd;
  --eah-blue-bright: #1893ff;
  --eah-blue-light: #44a8fe;
  --eah-blue-dark: #094aa8;
  --eah-navy: #101c3f;
  --eah-navy-2: #1b2a55;
  --eah-gold: #fec514;
  --eah-gold-warm: #ffad19;
  --eah-magenta: #f04e98;
  --eah-mint: #48efcf;
  --eah-mint-deep: #1ec9a4;

  --ink: #1d1e23;
  --paper: #ffffff;
  --eah-card: #eff1f4;
  --eah-card-2: #e6e9ee;
  --muted: #5b6370;
  --muted-2: #9096a6;

  --rule: rgba(11, 100, 221, 0.55);
}

html, body, #root {
  height: 100%;
  margin: 0;
  font-family:
    "Inter",
    ui-sans-serif,
    system-ui,
    -apple-system,
    sans-serif;
  overflow: hidden;
}
html[data-mode="deck"],
html[data-mode="deck"] body,
html[data-mode="deck"] #root {
  background: var(--eah-navy);
  color: var(--paper);
}

.mono {
  font-family: "JetBrains Mono", ui-monospace, monospace;
}

/* ──────────────────────────────────────────────────────────
 * Slide stage — fixed 1280×720 design coordinate space.
 *
 * Every slide is authored in this fixed pixel grid (so font
 * sizes / paddings / absolute positions always behave the
 * same regardless of viewport size). The .stage-wrap parent
 * picks the largest 16:9 box that fits the viewport and
 * applies a CSS transform to scale the stage into that box.
 * ────────────────────────────────────────────────────────── */
.stage-wrap {
  position: relative;
  width: min(100vw, calc(100vh * 16 / 9));
  height: min(100vh, calc(100vw * 9 / 16));
  /* CSS variable set inline by App: --stage-scale = box.width / 1280 */
  overflow: hidden;
}
.slide-stage {
  width: 1280px;
  height: 720px;
  background: var(--paper);
  color: var(--ink);
  position: absolute;
  top: 0;
  left: 0;
  transform: scale(var(--stage-scale, 1));
  transform-origin: top left;
  overflow: hidden;
}
/* Clip slide content to the 1280×720 frame (scales with stage-wrap). */
.slide-stage > .absolute.inset-0 {
  overflow: hidden;
  box-sizing: border-box;
}

/* Slide-stage variants. */
.slide-light { background: var(--paper); color: var(--ink); }
.slide-blue  { background: var(--eah-blue); color: var(--paper); }
.slide-navy  { background: var(--eah-navy); color: var(--paper); }
.slide-gold  { background: var(--eah-gold); color: var(--ink); }

/* ──────────────────────────────────────────────────────────
 * Color helpers (text + bg) — utility classes referenced by slides.
 * ────────────────────────────────────────────────────────── */
.eah-blue        { color: var(--eah-blue); }
.eah-blue-bright { color: var(--eah-blue-bright); }
.eah-mint        { color: var(--eah-mint); }
.eah-gold        { color: var(--eah-gold); }
.eah-magenta     { color: var(--eah-magenta); }
.eah-navy        { color: var(--eah-navy); }

.bg-eah-blue        { background: var(--eah-blue); }
.bg-eah-blue-bright { background: var(--eah-blue-bright); }
.bg-eah-mint        { background: var(--eah-mint); }
.bg-eah-gold        { background: var(--eah-gold); }
.bg-eah-magenta     { background: var(--eah-magenta); }
.bg-eah-navy        { background: var(--eah-navy); }
.bg-eah-card        { background: var(--eah-card); }
.bg-paper           { background: var(--paper); }

.text-ink   { color: var(--ink); }
.text-paper { color: var(--paper); }
.text-muted { color: var(--muted); }

/* Common opacity variants used across slides. */
.text-paper\/90 { color: rgba(255, 255, 255, 0.90); }
.text-paper\/85 { color: rgba(255, 255, 255, 0.85); }
.text-paper\/80 { color: rgba(255, 255, 255, 0.80); }
.text-paper\/70 { color: rgba(255, 255, 255, 0.70); }
.text-paper\/60 { color: rgba(255, 255, 255, 0.60); }
.text-paper\/50 { color: rgba(255, 255, 255, 0.50); }
.text-paper\/40 { color: rgba(255, 255, 255, 0.40); }

.text-ink\/90 { color: rgba(29, 30, 35, 0.90); }
.text-ink\/85 { color: rgba(29, 30, 35, 0.85); }
.text-ink\/80 { color: rgba(29, 30, 35, 0.80); }
.text-ink\/70 { color: rgba(29, 30, 35, 0.70); }
.text-ink\/60 { color: rgba(29, 30, 35, 0.60); }
.text-ink\/50 { color: rgba(29, 30, 35, 0.50); }
.text-ink\/40 { color: rgba(29, 30, 35, 0.40); }

.border-paper\/15 { border-color: rgba(255, 255, 255, 0.15); }
.border-paper\/20 { border-color: rgba(255, 255, 255, 0.20); }
.border-paper\/30 { border-color: rgba(255, 255, 255, 0.30); }
.border-ink\/10   { border-color: rgba(29, 30, 35, 0.10); }
.border-ink\/15   { border-color: rgba(29, 30, 35, 0.15); }
.border-ink\/20   { border-color: rgba(29, 30, 35, 0.20); }
.border-eah-blue\/30 { border-color: rgba(11, 100, 221, 0.30); }
.border-eah-blue\/60 { border-color: rgba(11, 100, 221, 0.60); }

.bg-paper\/5   { background-color: rgba(255, 255, 255, 0.05); }
.bg-paper\/10  { background-color: rgba(255, 255, 255, 0.10); }
.bg-paper\/15  { background-color: rgba(255, 255, 255, 0.15); }
.bg-ink\/5     { background-color: rgba(29, 30, 35, 0.05); }
.bg-ink\/10    { background-color: rgba(29, 30, 35, 0.10); }
.bg-eah-navy\/95 { background-color: rgba(16, 28, 63, 0.95); }
.bg-eah-blue\/10 { background-color: rgba(11, 100, 221, 0.10); }
.bg-eah-blue\/20 { background-color: rgba(11, 100, 221, 0.20); }

/* ──────────────────────────────────────────────────────────
 * EAH content-slide title block.
 *   - Bold dark headline + lighter subtitle below.
 *   - Used on white-background content slides (most slides).
 * ────────────────────────────────────────────────────────── */
.eah-content-title {
  font-weight: 800;
  font-size: 46px;
  line-height: 1.05;
  letter-spacing: -0.01em;
  color: var(--ink);
  margin: 0;
  max-width: 900px;
}
.eah-content-subtitle {
  font-size: 20px;
  line-height: 1.4;
  color: var(--muted);
  margin-top: 10px;
  font-weight: 400;
  max-width: 820px;
}

/* Section-divider headline (huge, on solid blue). */
.eah-section-title {
  font-weight: 800;
  font-size: 66px;
  line-height: 1.0;
  letter-spacing: -0.01em;
  color: var(--paper);
  margin: 0;
}

/* Cover (slide 01) ultra-large headline. */
.eah-cover-title {
  font-weight: 900;
  font-size: 90px;
  line-height: 0.95;
  letter-spacing: -0.015em;
  color: var(--paper);
  margin: 0;
  text-transform: uppercase;
}
.eah-cover-shadow {
  font-weight: 900;
  font-size: 74px;
  line-height: 0.95;
  letter-spacing: -0.015em;
  color: var(--eah-blue-bright);
  margin: 0;
  text-transform: uppercase;
}

/* Stat slide huge number (mint on navy). */
.eah-stat-num {
  font-weight: 900;
  font-size: 202px;
  line-height: 0.9;
  letter-spacing: -0.02em;
  color: var(--eah-mint);
  margin: 0;
}

/* Quote slide — big navy text on yellow. */
.eah-quote-text {
  font-weight: 400;
  font-size: 38px;
  line-height: 1.25;
  color: var(--ink);
  margin: 0;
}
.eah-quote-text strong { font-weight: 700; }
.eah-quote-mark {
  font-family: "Inter", system-ui, sans-serif;
  font-weight: 900;
  font-size: 122px;
  line-height: 0.7;
  color: var(--eah-blue);
}

/* ──────────────────────────────────────────────────────────
 * Agenda right-aligned list with thin blue rules.
 * ────────────────────────────────────────────────────────── */
.eah-agenda {
  display: flex;
  flex-direction: column;
  align-items: stretch;
}
.eah-agenda-row {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  border-top: 1px solid var(--rule);
  padding: 14px 0 10px 0;
  font-size: 20px;
  font-weight: 500;
  color: var(--ink);
}
.eah-agenda-row:last-child { border-bottom: 1px solid var(--rule); }
.eah-agenda-row .num {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 14px;
  letter-spacing: 0.10em;
  color: var(--eah-blue);
  margin-right: 16px;
}

/* ──────────────────────────────────────────────────────────
 * Callout boxes (like template page 4 / 5 / 30).
 * ────────────────────────────────────────────────────────── */
.eah-callout {
  border-radius: 14px;
  padding: 22px 24px;
  font-size: 16px;
  line-height: 1.45;
}
.eah-callout-blue  { background: var(--eah-blue); color: var(--paper); box-shadow: 0 4px 0 var(--eah-blue-dark); }
.eah-callout-light { background: var(--eah-card); color: var(--ink); }
.eah-callout-paper { background: var(--paper); color: var(--ink); border: 1px solid rgba(11, 100, 221, 0.20); }
.eah-callout .eah-callout-icon {
  width: 26px;
  height: 26px;
  margin-bottom: 10px;
}
.eah-callout-title {
  font-weight: 700;
  font-size: 17px;
  margin-bottom: 4px;
}

/* ──────────────────────────────────────────────────────────
 * Cards (FPO-style, page 33 / 25 / 30).
 * ────────────────────────────────────────────────────────── */
.eah-card {
  background: var(--eah-card);
  border-radius: 12px;
  padding: 20px;
  color: var(--ink);
}
.eah-card-icon {
  width: 56px;
  height: 56px;
  border-radius: 999px;
  background: var(--paper);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
  color: var(--eah-blue);
}
.eah-card-title {
  font-weight: 700;
  font-size: 17px;
  margin-bottom: 4px;
}
.eah-card-body {
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink);
}

/* ──────────────────────────────────────────────────────────
 * Step pills (template page 21).
 * ────────────────────────────────────────────────────────── */
.eah-pill-step {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  padding: 8px 22px;
  font-weight: 700;
  font-size: 18px;
  color: var(--ink);
}
.eah-pill-step--gold    { background: var(--eah-gold); color: var(--ink); }
.eah-pill-step--magenta { background: var(--eah-magenta); color: var(--paper); }
.eah-pill-step--mint    { background: var(--eah-mint); color: var(--ink); }
.eah-pill-step--blue    { background: var(--eah-blue); color: var(--paper); }

/* Timeline (template page 22) — thin grey rule with mint dots. */
.eah-timeline-rule {
  height: 1px;
  background: var(--ink);
  opacity: 0.35;
  position: relative;
}
.eah-timeline-dot {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  background: var(--eah-mint);
}

/* ──────────────────────────────────────────────────────────
 * Tag (small uppercase rounded pill).
 * ────────────────────────────────────────────────────────── */
.tag {
  display: inline-block;
  font-size: 13px;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 999px;
  background: var(--eah-blue);
  color: var(--paper);
}

/* ──────────────────────────────────────────────────────────
 * Speaker pill (kept; tinted with new palette).
 * ────────────────────────────────────────────────────────── */
.speaker-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 999px;
  font-family: "JetBrains Mono", ui-monospace, monospace;
}

/* ──────────────────────────────────────────────────────────
 * Code block.
 * ────────────────────────────────────────────────────────── */
pre.code {
  background: var(--eah-navy);
  color: #e6e6ee;
  border-radius: 10px;
  padding: 16px 20px;
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 14.5px;
  line-height: 1.55;
  overflow: auto;
  margin: 0;
  border: 1px solid rgba(255, 255, 255, 0.08);
}
pre.code .c { color: #8a93a8; }                  /* comment  */
pre.code .k { color: var(--eah-mint); }           /* keyword  */
pre.code .s { color: var(--eah-gold); }           /* string   */
pre.code .n { color: var(--eah-blue-light); }     /* number   */

/* ──────────────────────────────────────────────────────────
 * Deck chrome (footer, progress bar, kbd hints, Elastic logo).
 * ────────────────────────────────────────────────────────── */
.footnum {
  position: absolute;
  bottom: 14px;
  right: 24px;
  font-size: 13px;
  color: var(--muted);
  font-family: "JetBrains Mono", ui-monospace, monospace;
  letter-spacing: 0.10em;
  z-index: 2;
}
.slide-light .footnum {
  right: 118px;
}
.slide-blue .footnum,
.slide-navy .footnum,
.slide-gold .footnum {
  color: rgba(255, 255, 255, 0.55);
}
.slide-gold .footnum { color: rgba(29, 30, 35, 0.55); }

/* Elastic logo lockup — full mark + wordmark from assets/elastic.svg.
 * Position is set per slide (bottom-right on light, bottom-left on cover). */
.eah-elastic-lockup {
  position: absolute;
  z-index: 2;
  line-height: 0;
}
.eah-elastic-lockup--right { bottom: 22px; right: 28px; }
.eah-elastic-lockup--left  { bottom: 26px; left: 28px;  }
.eah-elastic-lockup--cover { bottom: 32px; left: 36px; }
.eah-elastic-lockup--end   { bottom: 18%; left: 50%; transform: translateX(-50%); }

.eah-elastic-logo {
  display: block;
  height: 22px;
  width: auto;
}
.eah-elastic-lockup--cover .eah-elastic-logo { height: 40px; }
.eah-elastic-lockup--end .eah-elastic-logo   { height: 56px; }

/* Demo recording slide — 16:9 video frame + phase caption strip. */
.demo-recording-wrap {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.demo-recording-frame {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  max-height: 340px;
  border-radius: 14px;
  overflow: hidden;
  background: var(--eah-navy);
  border: 1px solid rgba(11, 100, 221, 0.22);
}
.demo-recording-frame video {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  background: #000;
}
.demo-recording-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 32px;
  text-align: center;
  color: rgba(255, 255, 255, 0.82);
}
.demo-recording-placeholder .path {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 15px;
  color: var(--eah-mint);
  background: rgba(255, 255, 255, 0.08);
  padding: 6px 12px;
  border-radius: 8px;
}
.demo-recording-phases {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.demo-recording-phase {
  background: var(--eah-card);
  border-radius: 10px;
  padding: 10px 12px;
  border: 1px solid rgba(11, 100, 221, 0.12);
}
.demo-recording-phase .label {
  font-size: 15px;
  font-weight: 800;
  line-height: 1.15;
}
.demo-recording-phase .detail {
  font-size: 13px;
  line-height: 1.35;
  margin-top: 3px;
  opacity: 0.72;
}
.demo-recording-outcome {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 10px 16px;
  background: var(--eah-navy);
  border-radius: 10px;
  color: #fff;
  font-size: 15px;
  font-weight: 700;
}

.progress {
  position: fixed;
  bottom: 0;
  left: 0;
  height: 3px;
  background: var(--eah-blue);
  transition: width 200ms ease;
  z-index: 30;
}

.kbd {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 13px;
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid rgba(255, 255, 255, 0.30);
  background: rgba(255, 255, 255, 0.10);
  color: var(--paper);
  cursor: pointer;
}
.kbd:hover { background: rgba(255, 255, 255, 0.20); }

/* Step dots — top-center indicator for slides with internal stages. */
.step-dot {
  width: 8px;
  height: 8px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.30);
  display: inline-block;
}
.step-dot--active {
  background: var(--eah-mint);
  box-shadow: 0 0 0 3px rgba(72, 239, 207, 0.20);
}

/* ──────────────────────────────────────────────────────────
 * Overview grid — thumbnail cards rendered at 0.18 scale.
 * ────────────────────────────────────────────────────────── */
.overview-card {
  aspect-ratio: 16 / 9;
  background: var(--paper);
  color: var(--ink);
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  border: 2px solid transparent;
}
.overview-card.active { border-color: var(--eah-mint); }
.overview-card .stage-wrap { pointer-events: none; }

/* ──────────────────────────────────────────────────────────
 * SVG diagram primitives.
 * ────────────────────────────────────────────────────────── */
.diagram-arrow {
  stroke: var(--ink);
  stroke-width: 2;
  fill: none;
  marker-end: url(#arrowhead-ink);
}
.diagram-arrow-blue {
  stroke: var(--eah-blue);
  stroke-width: 2;
  fill: none;
  marker-end: url(#arrowhead-blue);
}
.diagram-node-text {
  font-family: "Inter", system-ui, sans-serif;
  font-weight: 700;
  font-size: 16px;
  fill: var(--ink);
}
.diagram-node-sub {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.10em;
  fill: var(--muted);
}

/* Animation used by dedup timeline slides. */
@keyframes pulse-bar {
  0%, 100% { opacity: 0.6; }
  50%      { opacity: 1.0; }
}
.dedup-bar-on { animation: pulse-bar 1.6s ease-in-out infinite; }

/* ──────────────────────────────────────────────────────────
 * Cover hero illustration — Madrid building motif.
 * Self-contained SVG primitives (gear/sun/cube/lock/rays/check/
 * lightbulb), rendered by EahHero in deck-shell.js.
 * ────────────────────────────────────────────────────────── */
.eah-hero-svg { color: var(--paper); }
.eah-hero-svg .fill-blue   { fill: var(--eah-blue-bright); }
.eah-hero-svg .fill-gold   { fill: var(--eah-gold-warm); }
.eah-hero-svg .fill-mint   { fill: var(--eah-mint); }
.eah-hero-svg .fill-navy   { fill: var(--eah-navy); }
.eah-hero-svg .stroke-navy { stroke: var(--eah-navy); fill: none; stroke-width: 3; stroke-linejoin: round; }
.eah-hero-svg .fill-paper  { fill: var(--paper); }

    </style>

    <style>
      /* ════════════════════════════════════════════════════════════
       * Presenter stylesheet (formerly scripts/presenter.css).
       * The html, body rule has been scoped to data-mode="presenter"
       * so it only applies in the second-screen window.
       * ════════════════════════════════════════════════════════════ */
/* ============================================================
 * Presenter view styles.
 *
 * The presenter window opens on the speaker's laptop while the
 * audience sees the main deck. Dark navy chrome so the
 * speaker's screen doesn't bleed light into the room; slide
 * previews keep their native (light) backgrounds so the speaker
 * sees exactly what the audience sees.
 *
 * Layout (CSS grid):
 *
 *   ┌─ header ──────────────────────────────────┐
 *   │ slide N/total · title · speaker · timers  │
 *   ├─ main (2 cols) ───────────────────────────┤
 *   │ current preview         │ speaker notes   │
 *   ├─ footer ──────────────────────────────────┤
 *   │ next preview + title    │ keyboard hints  │
 *   └───────────────────────────────────────────┘
 * ============================================================ */

:root {
  --p-bg: #0b1530;
  --p-panel: #14264d;
  --p-panel-2: #1c3464;
  --p-text: #ffffff;
  --p-text-dim: rgba(255, 255, 255, 0.65);
  --p-text-faint: rgba(255, 255, 255, 0.40);
  --p-kicker: rgba(255, 255, 255, 0.50);
  --p-line: rgba(255, 255, 255, 0.12);
  --p-accent: #48efcf;
  --p-magenta: #f04e98;
  --p-gold: #f4b400;
}

html[data-mode="presenter"],
html[data-mode="presenter"] body {
  background: var(--p-bg);
  color: var(--p-text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

#presenter-root {
  height: 100vh;
  width: 100vw;
}

.presenter-root {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 18px;
  padding: 20px 28px;
  height: 100%;
  box-sizing: border-box;
}

/* ── Header ─────────────────────────────────────────────── */

.presenter-header {
  display: grid;
  grid-template-columns: auto 1fr auto auto;
  align-items: center;
  gap: 24px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--p-line);
}

.presenter-header .slide-no {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--p-text);
}

.presenter-header .slide-no .dim {
  color: var(--p-text-faint);
  font-weight: 400;
}

.presenter-header .title {
  font-size: 26px;
  font-weight: 800;
  line-height: 1.1;
  color: var(--p-text);
}

.presenter-header .speaker {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 13px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--p-accent);
}

.presenter-header .timers {
  display: flex;
  gap: 18px;
  align-items: stretch;
}

.presenter-header .timer {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
  min-width: 88px;
}

.presenter-header .timer .kicker {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: 0.20em;
  text-transform: uppercase;
  color: var(--p-text-faint);
  font-weight: 700;
}

.presenter-header .timer .value {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 30px;
  line-height: 1;
  font-weight: 700;
  color: var(--p-text);
  font-variant-numeric: tabular-nums;
}

.presenter-header .timer.slide .value {
  color: var(--p-accent);
}

/* ── Main (two-column body) ─────────────────────────────── */

.presenter-main {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  gap: 24px;
  min-height: 0;
}

.pane {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
}

.pane-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}

.kicker {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--p-kicker);
}

.step-badge,
.time-target {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 13px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--p-accent);
}

/* ── Slide preview (renders the actual slide React tree) ── */

.preview {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #ffffff;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
}

/* The .stage-wrap inside slides is `display: block` with the
   slide CSS-scaled into its container. Force it to fill the
   preview box. */
.preview > .stage-wrap {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.preview-small {
  width: 260px;
  aspect-ratio: 16 / 9;
  border-radius: 8px;
  flex-shrink: 0;
}

/* ── Step dots (mirror of the main deck's pip strip) ────── */

.step-dots {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-top: 4px;
}

.step-dot {
  width: 8px;
  height: 8px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.20);
  transition: background 180ms ease, transform 180ms ease;
}

.step-dot--active {
  background: var(--p-accent);
  transform: scale(1.25);
}

/* ── Notes panel ────────────────────────────────────────── */

.notes-body {
  background: var(--p-panel);
  border-radius: 10px;
  padding: 18px 22px;
  border: 1px solid var(--p-line);
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
}

.notes-empty {
  background: var(--p-panel);
  border-radius: 10px;
  padding: 22px;
  border: 1px dashed var(--p-line);
  color: var(--p-text-faint);
  font-style: italic;
}

/* ── Note sections (sub-paragraphs) ───────────────────────
 * Each section is a short bold hook (the "title", rendered
 * as an uppercase mono kicker so the speaker can scan the
 * stack at a glance) followed by a 1–3 sentence body in
 * the speaker's first-person voice. The mint left rule ties
 * them to the deck accent without competing with the body
 * text.
 * ─────────────────────────────────────────────────────── */
.note-sections {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.note-section {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 2px 0 2px 12px;
  border-left: 2px solid rgba(72, 239, 207, 0.45);
}

.note-section-title {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--p-accent);
}

.note-section-body {
  margin: 0;
  font-size: 18px;
  line-height: 1.5;
  color: var(--p-text);
}

.quote {
  margin: 0;
  padding: 12px 16px;
  background: rgba(72, 239, 207, 0.10);
  border-left: 3px solid var(--p-accent);
  border-radius: 6px;
  font-size: 18px;
  line-height: 1.45;
  font-style: italic;
  color: var(--p-text);
}

.quote .kicker {
  display: block;
  font-style: normal;
  color: var(--p-accent);
  margin-bottom: 4px;
}

.note-strip {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 10px 14px;
  border-radius: 6px;
  font-size: 16px;
  line-height: 1.45;
  background: rgba(255, 255, 255, 0.04);
  border-left: 3px solid var(--p-text-faint);
}

.note-strip.handoff {
  border-left-color: var(--p-accent);
}

.note-strip.pivot {
  border-left-color: var(--p-magenta);
  background: rgba(240, 78, 152, 0.08);
}

.note-strip.interaction {
  border-left-color: var(--p-gold);
}

/* ── Footer (next slide + keyboard hints) ───────────────── */

.presenter-footer {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 24px;
  padding-top: 14px;
  border-top: 1px solid var(--p-line);
}

.next-block {
  display: flex;
  align-items: center;
  gap: 18px;
}

.next-block.next-end {
  color: var(--p-text-faint);
  font-style: italic;
}

.next-block .dim {
  color: var(--p-text-faint);
}

.next-meta {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.next-meta .next-title {
  font-size: 19px;
  font-weight: 700;
  line-height: 1.2;
  color: var(--p-text);
}

.next-meta .next-speaker {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--p-text-faint);
}

/* ── Keyboard hints ─────────────────────────────────────── */

.kbd-hints {
  display: flex;
  gap: 18px;
  align-items: center;
}

.kbd-row {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--p-text-faint);
  font-size: 13px;
}

.kbd-row .kbd {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  padding: 4px 8px;
  border-radius: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--p-line);
  color: var(--p-text);
  min-width: 22px;
  text-align: center;
  text-transform: lowercase;
}

.kbd-row .lbl {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 700;
}

/* ── Tighten layout on shorter windows ──────────────────── */

@media (max-height: 720px) {
  .presenter-root {
    padding: 12px 18px;
    gap: 12px;
  }
  .presenter-header .title {
    font-size: 22px;
  }
  .presenter-header .timer .value {
    font-size: 26px;
  }
  .note-section-body {
    font-size: 16px;
  }
  .note-sections {
    gap: 10px;
  }
  .notes-body {
    padding: 14px 18px;
  }
}

    const height = ELASTIC_LOGO_HEIGHT[variant] || ELASTIC_LOGO_HEIGHT.right;
    return html`

  function FootNum({ n, total }) {
    return html`

    return html`

            background: dark ? "#ffffff" : "#1d1e23",

        />

  function SlideLight({ n, total, children, speaker, hideLogo = false }) {
    return html`

          html`<div className="absolute" style=${{ top: "0", right: "0" }}>

          ${children}

        ${!hideLogo && html`<${ElasticLockup} variant="right" />`}
        <${FootNum} n=${n} total=${total} />

          html`<div className="absolute top-6 right-24">

  // SpeakerHex — hex-shaped avatar with one or two initials,
  // tinted with the speaker's accent color. Used on the Q&A

  function SpeakerHex({ initials, color, size = 72, label }) {
    // Hex (flat-top) path inside a 100x100 viewBox.

    return html`

  // ──────────────────────────────────────────────────────────
  // MiniSparkline — tiny inline chart. `points` is an array of
  // numbers; we normalise into the configured width/height. If
  // `changeAt` is given (0..1 of width), draws a vertical
  // accent line and a contrasting "after" colour.
  // ──────────────────────────────────────────────────────────
  function MiniSparkline({
    points,
    width = 140,
    height = 38,
    color = "var(--eah-blue)",
    accent = "var(--eah-magenta)",
    changeAt,
    style,
  }) {
    if (!points || points.length < 2) return null;
    const min = Math.min(...points);
    const max = Math.max(...points);
    const range = max - min || 1;
    const stepX = width / (points.length - 1);
    const yFor = (v) => height - 4 - ((v - min) / range) * (height - 8);
    const path = points
      .map((v, i) => `${i === 0 ? "M" : "L"} ${(i * stepX).toFixed(1)} ${yFor(v).toFixed(1)}`)
      .join(" ");

    let beforePath = path;
    let afterPath = null;
    let cpX = null;
    if (changeAt !== undefined) {
      cpX = changeAt * width;
      const cpIdx = (points.length - 1) * changeAt;
      const beforePts = points.slice(0, Math.ceil(cpIdx) + 1);
      const afterPts = points.slice(Math.floor(cpIdx));
      const offsetAfter = Math.floor(cpIdx) * stepX;
      beforePath = beforePts
        .map((v, i) => `${i === 0 ? "M" : "L"} ${(i * stepX).toFixed(1)} ${yFor(v).toFixed(1)}`)
        .join(" ");
      afterPath = afterPts
        .map(
          (v, i) =>
            `${i === 0 ? "M" : "L"} ${(offsetAfter + i * stepX).toFixed(1)} ${yFor(v).toFixed(1)}`,
        )
        .join(" ");
    }

    return html`
      <svg
        viewBox="0 0 ${width} ${height}"
        width=${width}
        height=${height}
        style=${{ display: "block", ...style }}
      >
        ${cpX !== null &&
        html`<line
          x1=${cpX}
          x2=${cpX}
          y1="0"
          y2=${height}
          stroke=${accent}
          strokeWidth="1.5"
          strokeDasharray="3 3"
          opacity="0.85"
        />`}
        <path
          d=${beforePath}
          fill="none"
          stroke=${color}
          strokeWidth="2"
          strokeLinejoin="round"
          strokeLinecap="round"
        />
        ${afterPath &&
        html`<path
          d=${afterPath}
          fill="none"
          stroke=${accent}
          strokeWidth="2"
          strokeLinejoin="round"
          strokeLinecap="round"
        />`}
      </svg>
    `;
  }

  // ──────────────────────────────────────────────────────────
  // Legacy primitives — kept so older slide files keep working.
  // ──────────────────────────────────────────────────────────

  function FootBrand() {
    return html`<div className="footnum" style=${{ left: 24, right: "auto" }}>${BRAND}</div>`;

  // Expose primitives for slide files.

    PillStep,

  // ──────────────────────────────────────────────────────────
  // Overview & Help overlays.
  // ──────────────────────────────────────────────────────────

  function HelpOverlay({ open, onClose }) {
    if (!open) return null;
    const rows = [
      ["→ / Space / PgDn", "Next slide"],
      ["← / PgUp", "Previous slide"],
      ["Home / End", "First / last slide"],

  function Overview({ open, current, slides, onPick, onClose }) {
    if (!open) return null;
    return html`
      <div
        className="fixed inset-0 z-40 overflow-auto"
        style=${{ background: "rgba(16, 28, 63, 0.96)" }}

              <div
                className="mono eah-mint text-xs uppercase"
                style=${{ letterSpacing: "0.18em" }}
              >
                Overview
              </div>
              <div className="text-3xl font-extrabold text-paper">
                All slides (${slides.length})
              </div>
            </div>
            <div className="text-paper/60 text-sm">
              Click a slide to jump · Esc to close
            </div>
          </div>
          <div
            className="grid gap-5"
            style=${{ gridTemplateColumns: "repeat(4, 1fr)" }}
            onClick=${(e) => e.stopPropagation()}
          >
            ${slides.map(
              (Comp, i) => html`
                <div
                  key=${i}
                  className=${`overview-card ${i === current ? "active" : ""}`}
                  onClick=${() => onPick(i)}
                >

                    value=${{ step: 9999, total: 9999, setSlideTotal: () => {} }}
                  >
                    <${StageWrap}>
                      <${Comp} n=${i + 1} total=${slides.length} />
                    <//>
                  <//>
                  <div
                    className="absolute bottom-0 left-0 right-0 px-2 py-1 mono text-xs"
                    style=${{
                      background: "rgba(16,28,63,0.85)",
                      color: "#ffffff",

  // ──────────────────────────────────────────────────────────
  // App — keyboard nav, hash routing, chrome buttons.
  // ──────────────────────────────────────────────────────────

  function App() {
    const slides = window.SLIDES || [];
    const total = slides.length;

    const [i, setI] = useState(() => {
      const h = parseInt(window.location.hash.replace("#", ""), 10);
      return Number.isFinite(h) && h >= 1 && h <= total ? h - 1 : 0;
    });
    const [overview, setOverview] = useState(false);
    const [help, setHelp] = useState(false);

    const [step, setStep] = useState(0);
    const [stepTotal, setStepTotal] = useState(1);
    const stepRef = useRef({ step: 0, total: 1 });
    stepRef.current = { step, total: stepTotal };

    // Presenter window (second-screen notes). Opened via `N`
    // key or chrome button. We keep the handle so we can post
    // state updates to it and refocus instead of re-opening.
    const presenterRef = useRef(null);
    const openPresenter = useCallback(() => {
      if (presenterRef.current && !presenterRef.current.closed) {
        presenterRef.current.focus();
        return;
      }
      presenterRef.current = window.open(
        window.location.pathname + "?view=presenter",
        "eah-presenter",
        "popup=yes,width=1280,height=720",
      );
    }, []);

    const go = useCallback(
      (next) => {
        setI((cur) => {
          const nv = Math.max(0, Math.min(total - 1, next));
          if (nv !== cur) {
            // Reset step state for the incoming slide. The new
            // slide's useStepIndex effect will register the
            // real total during the next commit.
            setStep(0);
            setStepTotal(1);
            window.location.hash = String(nv + 1);
          }
          return nv;
        });
      },
      [total],
    );

    useEffect(() => {
      const onKey = (e) => {
        if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
          e.preventDefault();
          const { step: cs, total: ct } = stepRef.current;
          if (cs < ct - 1) {
            setStep(cs + 1);
          } else {
            go(i + 1);
          }
        } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
          e.preventDefault();
          const { step: cs } = stepRef.current;
          if (cs > 0) {
            setStep(cs - 1);
          } else {
            go(i - 1);
          }
        } else if (e.key === "Home") {
          go(0);
        } else if (e.key === "End") {
          go(total - 1);
        } else if (e.key === "f" || e.key === "F") {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen?.();
          } else {
            document.exitFullscreen?.();
          }
        } else if (e.key === "o" || e.key === "O") {
          setOverview((v) => !v);
        } else if (e.key === "n" || e.key === "N") {
          openPresenter();
        } else if (e.key === "?" || (e.shiftKey && e.key === "/")) {
          setHelp((v) => !v);
        } else if (e.key === "Escape") {
          setOverview(false);
          setHelp(false);
        }
      };
      window.addEventListener("keydown", onKey);
      return () => window.removeEventListener("keydown", onKey);
    }, [i, go, total, openPresenter]);

    // Two-way sync with the presenter view (?view=presenter) via
    // BroadcastChannel. BroadcastChannel survives main-deck refreshes
    // and pop-up window reloads — both sides just re-subscribe.
    //
    //   main → channel    { type: "state", slide, step, stepTotal, total }
    //   presenter → channel { type: "nav", key }      // synthesised keydown
    //   presenter → channel { type: "request" }       // ask for current state
    //
    // The channel lives for the lifetime of App; handlers rebind on
    // state changes to capture fresh values.
    const channelRef = useRef(null);
    useEffect(() => {
      try {
        channelRef.current = new BroadcastChannel("cursor-skills-deck");
      } catch (err) {
        channelRef.current = null;
      }
      return () => {
        channelRef.current?.close();
        channelRef.current = null;
      };
    }, []);

    useEffect(() => {
      channelRef.current?.postMessage({
        type: "state",
        slide: i,
        step,
        stepTotal,
        total,
      });
    }, [i, step, stepTotal, total]);

    useEffect(() => {
      const ch = channelRef.current;
      if (!ch) return undefined;
      const handler = (ev) => {
        const m = ev.data;
        if (!m || typeof m !== "object") return;
        if (m.type === "nav" && m.key) {
          window.dispatchEvent(new KeyboardEvent("keydown", { key: m.key }));
        } else if (m.type === "request") {
          ch.postMessage({
            type: "state",
            slide: i,
            step,
            stepTotal,
            total,
          });
        }
      };
      ch.addEventListener("message", handler);
      return () => ch.removeEventListener("message", handler);
    }, [i, step, stepTotal, total]);

    useEffect(() => {
      const onHash = () => {
        const h = parseInt(window.location.hash.replace("#", ""), 10);
        if (Number.isFinite(h) && h >= 1 && h <= total) {
          setI((cur) => {
            if (h - 1 !== cur) {
              setStep(0);
              setStepTotal(1);
            }
            return h - 1;
          });
        }
      };
      window.addEventListener("hashchange", onHash);
      return () => window.removeEventListener("hashchange", onHash);
    }, [total]);

    if (total === 0) {
      return html`
        <div
          className="w-screen h-screen flex items-center justify-center text-paper"
          style=${{ background: "var(--eah-navy)" }}
        >
          <div className="text-center">
            <div className="text-2xl font-bold eah-mint">No slides registered</div>
            <div className="mt-2 text-paper/70 mono text-sm">
              Did the inlined slide blocks execute?
            </div>
          </div>
        </div>
      `;
    }

    const Comp = slides[i];

    const stepCtx = useMemo(
      () => ({ step, total: stepTotal, setSlideTotal: setStepTotal }),
      [step, stepTotal],
    );

    return html`
      <div
        className="w-screen h-screen flex items-center justify-center relative"
        style=${{ background: "var(--eah-navy)" }}
      >
        <${StepContext.Provider} value=${stepCtx}>
          <${StageWrap}>
            <${Comp} n=${i + 1} total=${total} />
          <//>
        <//>

        <div
          className="progress"
          style=${{ width: `${((i + 1) / total) * 100}%` }}
        />

        ${stepTotal > 1 &&
        html`<div
          className="fixed top-3 left-1/2 -translate-x-1/2 flex items-center gap-1.5 z-30"
        >
          ${[...Array(stepTotal)].map(
            (_, k) => html`<span
              key=${k}
              className=${`step-dot${k === step ? " step-dot--active" : ""}`}
            />`,
          )}
        </div>`}

        <div className="fixed top-3 right-4 flex items-center gap-2 z-30">
          <button onClick=${openPresenter} className="kbd" title="Open presenter notes (second screen)">
            N · notes
          </button>
          <button onClick=${() => setOverview(true)} className="kbd">
            O · overview
          </button>
          <button onClick=${() => setHelp(true)} className="kbd">
            ? · help
          </button>
        </div>

        <div className="fixed bottom-3 left-1/2 -translate-x-1/2 flex items-center gap-3 z-30">
          <button
            onClick=${() => go(i - 1)}
            className="kbd"
            aria-label="Previous"
          >
            ← prev
          </button>
          <div className="kbd">
            ${String(i + 1).padStart(2, "0")} / ${String(total).padStart(2, "0")}
          </div>
          <button
            onClick=${() => go(i + 1)}
            className="kbd"
            aria-label="Next"
          >
            next →
          </button>
        </div>

        <${Overview}
          open=${overview}
          current=${i}
          slides=${slides}
          onPick=${(idx) => {
            go(idx);
            setOverview(false);
          }}
          onClose=${() => setOverview(false)}
        />
        <${HelpOverlay} open=${help} onClose=${() => setHelp(false)} />
      </div>
    `;
  }

  // ──────────────────────────────────────────────────────────
  // Mount — deferred. Slides register on window.SLIDES from
  // their inlined <script> blocks below; the boot script at
  // the bottom of this file calls mountDeck() once they have
  // all executed (or mountPresenter() in ?view=presenter mode).
  // ──────────────────────────────────────────────────────────

  window.mountDeck = function mountDeck() {
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(html`<${App} />`);
  };
})();

    </script>

    <script>
/* ============================================================

 * Speaker: Marco

(function () {

 * SLIDE_NOTES — Speaker notes per slide.
 *
 * Consumed by the presenter view (?view=presenter). Order
 * matches window.SLIDES (entry[i] = notes for slide i+1).
 *
 * Each entry:
 *   {
 *     title       — short slide title (echoed in presenter view)
 *     speaker     — who owns this slide
 *     timeTarget  — budgeted stage time
 *     sections[]  — array of { title, body } sub-paragraphs
 *     quote?      — line to deliver verbatim (optional)
 *     handoff?    — line for transitioning to the next slide
 *     pivot?      — fallback if something goes wrong
 *     interaction?— note about step-through or audience moves
 *   }
 *
 * Timing budget (60-min slot 2:15–3:15 · ~45 min content · ~15 min Q&A):

    <script>
/* ============================================================
 * Presenter view — second-screen notes for the main deck.
 *
 * Mounted when the page is opened with ?view=presenter. Listens
 * for state updates from the main deck (default view) over a
 * BroadcastChannel and renders:
 *
 *   header  — slide N/total · title · speaker · elapsed timer
 *   main    — current slide preview (left) + speaker notes (right)
 *   footer  — next slide preview + next title + keyboard hints
 *
 * Sync protocol on channel "cursor-skills-deck" (see deck-shell.js):
 *
 *   main → channel       { type: "state", slide, step, stepTotal, total }
 *   presenter → channel  { type: "nav", key }      // forwards keydown
 *   presenter → channel  { type: "request" }       // ask for state on mount
 *
 * Either window can refresh independently — both sides just
 * rejoin the channel and resync. Keyboard nav works in either
 * window (the presenter forwards nav keys to the main deck).
 *
 * Globals expected: window.html (htm), window.SLIDES,
 * window.SlideRenderer, window.SLIDE_NOTES.
 * ============================================================ */
(function () {
  const html = window.html;
  const { useEffect, useState, useRef, useMemo } = React;

  const SLIDES = window.SLIDES || [];
  const NOTES = window.SLIDE_NOTES || [];
  const TOTAL = SLIDES.length;

  // Keys we forward to the main deck.
  const NAV_KEYS = new Set([
    "ArrowRight",
    "ArrowLeft",
    "ArrowUp",
    "ArrowDown",
    "PageUp",
    "PageDown",
    "Home",
    "End",
    " ",
  ]);

  function pad(n) {
    return String(n).padStart(2, "0");
  }

  function fmtClock(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${pad(m)}:${pad(s)}`;
  }

  // ──────────────────────────────────────────────────────────
  // SlidePreview — small wrapper around SlideRenderer so we can
  // give each preview its own scaled container.
  // ──────────────────────────────────────────────────────────
  function SlidePreview({ slideIndex, step, small }) {
    const SR = window.SlideRenderer;
    if (!SR) return null;
    return html`
      <div className=${small ? "preview preview-small" : "preview"}>
        <${SR}
          slideIndex=${slideIndex}
          step=${step || 0}
          total=${TOTAL}
        />
      </div>
    `;
  }

  // ──────────────────────────────────────────────────────────
  // PresenterApp
  // ──────────────────────────────────────────────────────────
  function PresenterApp() {
    const [state, setState] = useState({
      slide: 0,
      step: 0,
      stepTotal: 1,
    });
    const [elapsed, setElapsed] = useState(0);
    const [slideElapsed, setSlideElapsed] = useState(0);

    const startedAt = useRef(Date.now());
    const slideStartedAt = useRef(Date.now());

    // Total elapsed timer ticks once a second.
    useEffect(() => {
      const id = setInterval(() => {
        setElapsed(Math.floor((Date.now() - startedAt.current) / 1000));
        setSlideElapsed(
          Math.floor((Date.now() - slideStartedAt.current) / 1000),
        );
      }, 1000);
      return () => clearInterval(id);
    }, []);

    // Reset the per-slide timer when the main deck advances.
    useEffect(() => {
      slideStartedAt.current = Date.now();
      setSlideElapsed(0);
    }, [state.slide]);

    // BroadcastChannel handle — used for both directions of sync
    // (state from main, nav requests back to main). Survives
    // either window refreshing because both sides just re-join.
    const channelRef = useRef(null);
    useEffect(() => {
      try {
        channelRef.current = new BroadcastChannel("cursor-skills-deck");
      } catch (err) {
        channelRef.current = null;
      }
      const ch = channelRef.current;
      if (!ch) return undefined;
      ch.addEventListener("message", (ev) => {
        const m = ev.data;
        if (!m || typeof m !== "object") return;
        if (m.type === "state") {
          setState({
            slide: typeof m.slide === "number" ? m.slide : 0,
            step: typeof m.step === "number" ? m.step : 0,
            stepTotal: typeof m.stepTotal === "number" ? m.stepTotal : 1,
          });
        }
      });
      // Ask main for current state in case it was already running
      // when we opened.
      ch.postMessage({ type: "request" });
      return () => {
        ch.close();
        channelRef.current = null;
      };
    }, []);

    // Forward navigation keys to the main deck. We don't mutate
    // local state directly — we wait for main to echo back state
    // so the two views never drift.
    useEffect(() => {
      const onKey = (e) => {
        if (e.key === "f" || e.key === "F") {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen?.();
          } else {
            document.exitFullscreen?.();
          }
          return;
        }
        if (e.key === "r" || e.key === "R") {
          // Reset elapsed + per-slide timer locally.
          startedAt.current = Date.now();
          slideStartedAt.current = Date.now();
          setElapsed(0);
          setSlideElapsed(0);
          return;
        }
        if (NAV_KEYS.has(e.key)) {
          e.preventDefault();
          channelRef.current?.postMessage({ type: "nav", key: e.key });
        }
      };
      window.addEventListener("keydown", onKey);
      return () => window.removeEventListener("keydown", onKey);
    }, []);

    const notes = NOTES[state.slide] || null;
    const nextIdx = state.slide + 1;
    const nextNotes = nextIdx < TOTAL ? NOTES[nextIdx] : null;
    const isLast = state.slide >= TOTAL - 1;

    const stepBadge = useMemo(() => {
      if (!state.stepTotal || state.stepTotal <= 1) return null;
      return `step ${pad(state.step + 1)} / ${pad(state.stepTotal)}`;
    }, [state.step, state.stepTotal]);

    return html`
      <div className="presenter-root">
        <${Header}
          slide=${state.slide}
          notes=${notes}
          elapsed=${elapsed}
          slideElapsed=${slideElapsed}
        />

        <main className="presenter-main">
          <div className="pane pane-current">
            <div className="pane-head">
              <span className="kicker">now</span>
              ${stepBadge &&
              html`<span className="step-badge">${stepBadge}</span>`}
            </div>
            <${SlidePreview} slideIndex=${state.slide} step=${state.step} />
            <${StepDots} step=${state.step} total=${state.stepTotal} />
          </div>

          <div className="pane pane-notes">
            <div className="pane-head">
              <span className="kicker">notes</span>
              ${notes?.timeTarget &&
              html`<span className="time-target">${notes.timeTarget}</span>`}
            </div>
            <${NotesPanel} notes=${notes} />
          </div>
        </main>

        <${Footer}
          isLast=${isLast}
          nextIdx=${nextIdx}
          nextNotes=${nextNotes}
        />
      </div>
    `;
  }

  // ──────────────────────────────────────────────────────────
  // Header — slide n/total, title, speaker, elapsed timer.
  // ──────────────────────────────────────────────────────────
  function Header({ slide, notes, elapsed, slideElapsed }) {
    return html`
      <header className="presenter-header">
        <div className="slide-no">
          slide ${pad(slide + 1)} <span className="dim">/ ${pad(TOTAL)}</span>
        </div>
        <div className="title">
          ${notes?.title || `Slide ${slide + 1}`}
        </div>
        ${notes?.speaker &&
        html`<div className="speaker">${notes.speaker}</div>`}
        <div className="timers">
          <div className="timer total">
            <span className="kicker">total</span>
            <span className="value">${fmtClock(elapsed)}</span>
          </div>
          <div className="timer slide">
            <span className="kicker">slide</span>
            <span className="value">${fmtClock(slideElapsed)}</span>
          </div>
        </div>
      </header>
    `;
  }

  // ──────────────────────────────────────────────────────────
  // StepDots — mirrors the dots shown on the main deck so the
  // presenter can see at a glance which step they're on.
  // ──────────────────────────────────────────────────────────
  function StepDots({ step, total }) {
    if (!total || total <= 1) return null;
    return html`
      <div className="step-dots">
        ${[...Array(total)].map(
          (_, i) => html`<span
            key=${i}
            className=${i === step ? "step-dot step-dot--active" : "step-dot"}
          />`,
        )}
      </div>
    `;
  }

  // ──────────────────────────────────────────────────────────
  // NotesPanel — sub-paragraph sections + optional quote /
  // handoff / pivot / interaction strips.
  //
  // Each section renders as a short bold hook (scannable in
  // half a second under stage lights) followed by a 1–3
  // sentence body in first person. The speaker reads the hook
  // to locate the beat, falls back to the body if they blanked.
  // ──────────────────────────────────────────────────────────
  function NotesPanel({ notes }) {
    if (!notes) {
      return html`
        <div className="notes-empty">No notes for this slide.</div>
      `;
    }
    const sections = notes.sections || [];
    return html`
      <div className="notes-body">
        <div className="note-sections">
          ${sections.map(
            (s, i) => html`
              <section className="note-section" key=${i}>
                <div className="note-section-title">${s.title}</div>
                <p className="note-section-body">${s.body}</p>
              </section>
            `,
          )}
        </div>
        ${notes.quote &&
        html`<blockquote className="quote">
          <span className="kicker">say</span>
          ${notes.quote}
        </blockquote>`}
        ${notes.handoff &&
        html`<div className="note-strip handoff">
          <span className="kicker">handoff</span>
          ${notes.handoff}
        </div>`}
        ${notes.pivot &&
        html`<div className="note-strip pivot">
          <span className="kicker">pivot</span>
          ${notes.pivot}
        </div>`}
        ${notes.interaction &&
        html`<div className="note-strip interaction">
          <span className="kicker">interaction</span>
          ${notes.interaction}
        </div>`}
      </div>
    `;
  }

  // ──────────────────────────────────────────────────────────
  // Footer — next slide preview + title + keyboard hint strip.
  // ──────────────────────────────────────────────────────────
  function Footer({ isLast, nextIdx, nextNotes }) {
    return html`
      <footer className="presenter-footer">
        ${isLast
          ? html`<div className="next-block next-end">
              <span className="kicker">next</span>
              <span className="dim">last slide</span>
            </div>`
          : html`<div className="next-block">
              <${SlidePreview} slideIndex=${nextIdx} step=${0} small />
              <div className="next-meta">
                <span className="kicker">next · ${pad(nextIdx + 1)}</span>
                <div className="next-title">${nextNotes?.title || "…"}</div>
                ${nextNotes?.speaker &&
                html`<div className="next-speaker">
                  ${nextNotes.speaker}
                </div>`}
              </div>
            </div>`}

        <div className="kbd-hints">
          <span className="kbd-row">
            <span className="kbd">←</span><span className="kbd">→</span>
            <span className="kbd">space</span>
            <span className="lbl">navigate</span>
          </span>
          <span className="kbd-row">
            <span className="kbd">F</span><span className="lbl">fullscreen</span>
          </span>
          <span className="kbd-row">
            <span className="kbd">R</span><span className="lbl">reset timer</span>
          </span>
        </div>
      </footer>
    `;
  }

  // ──────────────────────────────────────────────────────────
  // Mount — invoked by the boot script at the bottom of
  // index.html when ?view=presenter is set, after every slide
  // and notes script has executed.
  // ──────────────────────────────────────────────────────────
  window.mountPresenter = function mountPresenter() {
    const root = ReactDOM.createRoot(
      document.getElementById("presenter-root"),
    );
    root.render(html`<${PresenterApp} />`);
  };
})();

    </script>

    <script>
      // Boot the right app for the active mode.
      if (document.documentElement.dataset.mode === "presenter") {
        window.mountPresenter();
      } else {
        window.mountDeck();
      }
    </script>
  </body>
</html>
